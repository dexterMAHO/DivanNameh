---
- name: Deploy DivanNameh to Ubuntu 24.04
  hosts: divan_servers
  become: true
  vars:
    divan_root: /opt/divannameh
    divan_use_existing_nginx: false
    divan_nginx_http_port: 18080
    divan_source: "{{ playbook_dir }}/../.."
    divan_secrets_file: "{{ lookup('ansible.builtin.env', 'DIVAN_SECRETS_FILE') }}"
    divan_release: "{{ divan_root }}/releases/{{ divan_revision.stdout }}"
    divan_compose:
      - docker
      - compose
      - --project-name
      - divannameh
      - --env-file
      - "{{ divan_root }}/secrets.env"
      - --env-file
      - "{{ divan_release }}/compose.env"
  tasks:
    - name: Validate target and domain
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '24.04'
          - divan_domain is defined
          - divan_domain is match('^[a-zA-Z0-9][a-zA-Z0-9-]*(\\.[a-zA-Z0-9][a-zA-Z0-9-]*)+$')
          - (divan_workers | default(2) | int) > 0

    - name: Read the committed revision from the controller
      ansible.builtin.command:
        argv: [git, -C, "{{ divan_source }}", rev-parse, HEAD]
      delegate_to: localhost
      become: false
      register: divan_revision
      changed_when: false

    - name: Check for an existing Docker Compose installation
      ansible.builtin.command: docker compose version
      register: divan_existing_compose
      changed_when: false
      failed_when: false

    - name: Install Docker and Compose when missing
      when: divan_existing_compose.rc != 0
      block:
        - name: Detect the Docker package family already installed
          ansible.builtin.package_facts:
            manager: apt

        - name: Install Docker from the matching package repository
          ansible.builtin.apt:
            name: "{{ divan_docker_packages }}"
            update_cache: true
            cache_valid_time: 3600
            fail_on_autoremove: true
          vars:
            divan_docker_packages: >-
              {{ ['docker-ce', 'docker-ce-cli', 'docker-buildx-plugin', 'docker-compose-plugin']
                 if 'containerd.io' in ansible_facts.packages or 'docker-ce' in ansible_facts.packages
                 else ['docker.io', 'docker-compose-v2'] }}

    - name: Install OpenSSL for credential generation
      ansible.builtin.apt:
        name: openssl
        state: present

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create the deployment and release directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - "{{ divan_root }}"
        - "{{ divan_release }}"

    - name: Transfer committed source from the controller
      block:
        - name: Allocate temporary archive on the controller
          ansible.builtin.tempfile:
            state: file
            suffix: .tar.gz
          delegate_to: localhost
          become: false
          register: divan_archive
          changed_when: false

        - name: Archive the selected Git revision
          ansible.builtin.command:
            argv:
              - git
              - -C
              - "{{ divan_source }}"
              - archive
              - --format=tar.gz
              - "--output={{ divan_archive.path }}"
              - "{{ divan_revision.stdout }}"
          delegate_to: localhost
          become: false
          changed_when: false

        - name: Unpack release on target
          ansible.builtin.unarchive:
            src: "{{ divan_archive.path }}"
            dest: "{{ divan_release }}"
            creates: "{{ divan_release }}/.source-ready"

        - name: Mark the source archive as fully extracted
          ansible.builtin.copy:
            content: "{{ divan_revision.stdout }}\n"
            dest: "{{ divan_release }}/.source-ready"
            mode: "0640"
      always:
        - name: Remove temporary controller archive
          ansible.builtin.file:
            path: "{{ divan_archive.path }}"
            state: absent
          delegate_to: localhost
          become: false
          changed_when: false
          when: divan_archive.path is defined

    - name: Install controller credentials on first deployment
      ansible.builtin.copy:
        src: "{{ divan_secrets_file }}"
        dest: "{{ divan_root }}/secrets.env"
        owner: root
        group: root
        mode: "0600"
        force: false
      when: divan_secrets_file | length > 0
      no_log: true

    - name: Generate persistent credentials on the server
      ansible.builtin.shell:
        cmd: |
          set -eu
          umask 077
          secret_key=$(openssl rand -hex 48)
          db_password=$(openssl rand -hex 32)
          printf 'DIVAN_SECRET_KEY=%s\nDIVAN_DB_PASSWORD=%s\n' "$secret_key" "$db_password" > secrets.env.tmp
          mv secrets.env.tmp secrets.env
        chdir: "{{ divan_root }}"
        creates: "{{ divan_root }}/secrets.env"
      when: divan_secrets_file | length == 0
      no_log: true

    - name: Write the Compose settings
      ansible.builtin.template:
        src: compose.env.j2
        dest: "{{ divan_release }}/compose.env"
        mode: "0640"

    - name: Route HTTP through the existing Nginx instance
      when: divan_use_existing_nginx | bool
      block:
        - name: Write a virtual host for the DivanNameh domain
          ansible.builtin.template:
            src: nginx-http.conf.j2
            dest: "/etc/nginx/sites-enabled/divannameh-{{ divan_domain }}.conf"
            owner: root
            group: root
            mode: "0644"
          register: divan_nginx_site

        - name: Validate Nginx configuration
          ansible.builtin.command: nginx -t
          changed_when: false

        - name: Reload Nginx for the new virtual host
          ansible.builtin.service:
            name: nginx
            state: reloaded
          when: divan_nginx_site.changed

    - name: Build and start the release
      ansible.builtin.command:
        argv: "{{ divan_compose + ['up', '--detach', '--build', '--wait', '--wait-timeout', '180'] }}"
        chdir: "{{ divan_release }}"
      register: divan_compose_up
      changed_when: divan_compose_up.stderr is search('Created|Recreated|Started|Built')

    - name: Verify the new release directly on the origin
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --max-time
          - "10"
          - --noproxy
          - "{{ divan_domain }}"
          - --resolve
          - "{{ divan_domain }}:443:127.0.0.1"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - "https://{{ divan_domain }}/login/"
      register: divan_origin
      until: divan_origin.rc == 0 and divan_origin.stdout == '200'
      retries: 18
      delay: 5
      changed_when: false
      when: divan_verify_origin | default(false) | bool

    - name: Verify the live HTTPS login from the controller
      ansible.builtin.uri:
        url: "https://{{ divan_domain }}/login/"
        status_code: 200
      delegate_to: localhost
      become: false
      register: divan_login
      until: divan_login.status == 200
      retries: 18
      delay: 5

    - name: Record the verified release
      ansible.builtin.file:
        src: "{{ divan_release }}"
        dest: "{{ divan_root }}/current"
        state: link
