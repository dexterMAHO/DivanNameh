---
- name: Deploy DivanNameh
  hosts: divan_servers
  become: true
  vars:
    divan_root: /opt/divannameh
    divan_use_existing_nginx: false
    divan_nginx_http_port: 18080
    # Set divan_demo_domain to also serve the demo site from this host. Left
    # empty, every task below is skipped and the deployment is unchanged.
    divan_demo_domain: ""
    divan_demo_enabled: "{{ divan_demo_domain | length > 0 }}"
    divan_demo_clone: true
    divan_compose_files: "{{ ['-f', 'compose.yaml', '-f', 'compose.demo.yaml'] if divan_demo_domain | length > 0 else [] }}"
    divan_source: "{{ playbook_dir }}/../.."
    divan_secrets_file: "{{ lookup('ansible.builtin.env', 'DIVAN_SECRETS_FILE') }}"
    divan_release: "{{ divan_root }}/releases/{{ divan_revision.stdout }}"
    divan_compose:
      - docker
      - compose
      - --project-name
      - divannameh
      - --env-file
      - "{{ divan_root }}/secrets.env"
      - --env-file
      - "{{ divan_release }}/compose.env"
  tasks:
    - name: Validate target and domain
      ansible.builtin.assert:
        that:
          - (ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_version == '24.04') or
            (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version == '12')
          - divan_domain is defined
          - divan_domain is match('^[a-zA-Z0-9][a-zA-Z0-9-]*(\\.[a-zA-Z0-9][a-zA-Z0-9-]*)+$')
          - (divan_workers | default(2) | int) > 0
          - not (divan_demo_enabled | bool) or
            divan_demo_domain is match('^[a-zA-Z0-9][a-zA-Z0-9-]*(\\.[a-zA-Z0-9][a-zA-Z0-9-]*)+$')
          - not (divan_demo_enabled | bool) or divan_demo_domain != divan_domain

    - name: Read the committed revision from the controller
      ansible.builtin.command:
        argv: [git, -C, "{{ divan_source }}", rev-parse, HEAD]
      delegate_to: localhost
      become: false
      register: divan_revision
      changed_when: false

    - name: Prepare Docker Engine
      ansible.builtin.import_tasks: docker-tasks.yml

    - name: Create the deployment and release directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - "{{ divan_root }}"
        - "{{ divan_release }}"

    - name: Transfer committed source from the controller
      block:
        - name: Allocate temporary archive on the controller
          ansible.builtin.tempfile:
            state: file
            suffix: .tar.gz
          delegate_to: localhost
          become: false
          register: divan_archive
          changed_when: false

        - name: Archive the selected Git revision
          ansible.builtin.command:
            argv:
              - git
              - -C
              - "{{ divan_source }}"
              - archive
              - --format=tar.gz
              - "--output={{ divan_archive.path }}"
              - "{{ divan_revision.stdout }}"
          delegate_to: localhost
          become: false
          changed_when: false

        - name: Unpack release on target
          ansible.builtin.unarchive:
            src: "{{ divan_archive.path }}"
            dest: "{{ divan_release }}"
            creates: "{{ divan_release }}/.source-ready"

        - name: Mark the source archive as fully extracted
          ansible.builtin.copy:
            content: "{{ divan_revision.stdout }}\n"
            dest: "{{ divan_release }}/.source-ready"
            mode: "0640"
      always:
        - name: Remove temporary controller archive
          ansible.builtin.file:
            path: "{{ divan_archive.path }}"
            state: absent
          delegate_to: localhost
          become: false
          changed_when: false
          when: divan_archive.path is defined

    - name: Install controller credentials on first deployment
      ansible.builtin.copy:
        src: "{{ divan_secrets_file }}"
        dest: "{{ divan_root }}/secrets.env"
        owner: root
        group: root
        mode: "0600"
        force: false
      when: divan_secrets_file | length > 0
      no_log: true

    - name: Generate persistent credentials on the server
      ansible.builtin.shell:
        cmd: |
          set -eu
          umask 077
          secret_key=$(openssl rand -hex 48)
          db_password=$(openssl rand -hex 32)
          printf 'DIVAN_SECRET_KEY=%s\nDIVAN_DB_PASSWORD=%s\n' "$secret_key" "$db_password" > secrets.env.tmp
          mv secrets.env.tmp secrets.env
        chdir: "{{ divan_root }}"
        creates: "{{ divan_root }}/secrets.env"
      when: divan_secrets_file | length == 0
      no_log: true

    - name: Add demo credentials to the server secrets
      # The demo signs its own cookies and owns its own database. Appended once;
      # existing values are never rewritten.
      ansible.builtin.shell:
        cmd: |
          set -eu
          umask 077
          added=""
          if ! grep -q '^DIVAN_DEMO_SECRET_KEY=' secrets.env; then
              printf 'DIVAN_DEMO_SECRET_KEY=%s\n' "$(openssl rand -hex 48)" >> secrets.env
              added="yes"
          fi
          if ! grep -q '^DIVAN_DEMO_DB_PASSWORD=' secrets.env; then
              printf 'DIVAN_DEMO_DB_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> secrets.env
              added="yes"
          fi
          printf '%s' "$added"
        chdir: "{{ divan_root }}"
      register: divan_demo_secrets
      changed_when: divan_demo_secrets.stdout == 'yes'
      when: divan_demo_enabled | bool
      no_log: true

    - name: Write the Compose settings
      ansible.builtin.template:
        src: compose.env.j2
        dest: "{{ divan_release }}/compose.env"
        mode: "0640"

    - name: Route HTTP through the existing Nginx instance
      when: divan_use_existing_nginx | bool
      block:
        - name: Write a virtual host for the DivanNameh domain
          ansible.builtin.template:
            src: nginx-http.conf.j2
            dest: "/etc/nginx/sites-enabled/divannameh-{{ divan_domain }}.conf"
            owner: root
            group: root
            mode: "0644"
          register: divan_nginx_site

        - name: Validate Nginx configuration
          ansible.builtin.command: nginx -t
          changed_when: false

        - name: Reload Nginx for the new virtual host
          ansible.builtin.service:
            name: nginx
            state: reloaded
          when: divan_nginx_site.changed

    - name: Check the two-site proxy configuration before restarting the proxy
      # The proxy serves the live site too, so a bad config here would stop both.
      ansible.builtin.command:
        argv: "{{ divan_compose + divan_compose_files + ['run', '--rm', '--no-deps', '--entrypoint', '', 'proxy', 'caddy', 'validate', '--config', '/etc/caddy/Caddyfile.with-demo', '--adapter', 'caddyfile'] }}"
        chdir: "{{ divan_release }}"
      when: divan_demo_enabled | bool
      changed_when: false

    - name: Build and start the release
      ansible.builtin.command:
        argv: "{{ divan_compose + divan_compose_files + ['up', '--detach', '--build', '--wait', '--wait-timeout', '180'] }}"
        chdir: "{{ divan_release }}"
      register: divan_compose_up
      changed_when: divan_compose_up.stderr is search('Created|Recreated|Started|Built')

    - name: Verify the new release directly on the origin
      ansible.builtin.command:
        argv:
          - curl
          - --fail
          - --silent
          - --show-error
          - --max-time
          - "10"
          - --noproxy
          - "{{ divan_domain }}"
          - --resolve
          - "{{ divan_domain }}:443:127.0.0.1"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - "https://{{ divan_domain }}/login/"
      register: divan_origin
      until: divan_origin.rc == 0 and divan_origin.stdout == '200'
      retries: 18
      delay: 5
      changed_when: false
      when: divan_verify_origin | default(false) | bool

    - name: Verify the live HTTPS login from the controller
      ansible.builtin.uri:
        url: "https://{{ divan_domain }}/login/"
        status_code: 200
      delegate_to: localhost
      become: false
      register: divan_login
      until: divan_login.status == 200
      retries: 18
      delay: 5

    - name: Copy the poetry corpus into the demo database
      # Reads the live database and writes only the treasury tables. Reader
      # accounts and personal notebooks are never copied; see deployment/DEMO.md.
      ansible.builtin.command:
        argv: "{{ divan_compose + divan_compose_files + ['run', '--rm', 'demo-clone', '--replace'] }}"
        chdir: "{{ divan_release }}"
      register: divan_demo_corpus
      changed_when: divan_demo_corpus.stdout is search('Corpus copied')
      when: divan_demo_enabled | bool and (divan_demo_clone | bool)

    - name: Verify the demo site over HTTPS from the controller
      ansible.builtin.uri:
        url: "https://{{ divan_demo_domain }}/login/"
        status_code: 200
      delegate_to: localhost
      become: false
      register: divan_demo_login
      until: divan_demo_login.status == 200
      retries: 18
      delay: 5
      when: divan_demo_enabled | bool

    - name: Record the verified release
      ansible.builtin.file:
        src: "{{ divan_release }}"
        dest: "{{ divan_root }}/current"
        state: link
