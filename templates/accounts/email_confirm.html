{% extends 'base.html' %}
{% block title %}تأیید ورود{% endblock %}
{% block content %}
<section class="login panel">
  <h1>تأیید ورود</h1>
  {% if error or not token %}
  <p class="notice error" role="alert">{{ error|default:'پیوند ورود معتبر نیست.' }}</p>
  <a href="{% url 'login' %}">دریافت پیوند جدید</a>
  {% else %}
  <form method="post" action="{% url 'email-confirm' %}">
    {% csrf_token %}
    <input type="hidden" name="token" value="{{ token }}">
    <button class="primary wide">ورود به دفتر</button>
  </form>
  {% endif %}
</section>
{% endblock %}
