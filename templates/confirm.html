{% extends 'base.html' %}
{% block title %}تأیید حذف{% endblock %}
{% block content %}
<section class="panel">
  <h1>{{ label }}</h1>
  <p>{{ explanation }}</p>
  <form method="post" class="form-actions">
    {% csrf_token %}
    <input type="hidden" name="confirm" value="yes">
    {% if return_query %}<input type="hidden" name="return_query" value="{{ return_query }}">{% endif %}
    <button class="primary">تأیید حذف</button>
    <a href="{{ cancel_url }}">انصراف</a>
  </form>
</section>
{% endblock %}
