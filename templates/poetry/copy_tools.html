<section class="copy-tools" id="copy-tools" hidden aria-label="کپی شعر">
  <details>
    <summary class="button quiet">کپی شعر</summary>
    {% if has_selection %}<p class="fine">برای کپی گزیده، بیت‌ها یا سطرهای متن را انتخاب کنید.</p>{% endif %}
    <label><input type="checkbox" id="copy-credit"> درج نام اثر، شاعر و منبع موجود</label>
    <div class="actions">
      <button type="button" id="copy-all">کپی تمام متن</button>
      {% if has_selection %}<button type="button" id="copy-selected">کپی گزیده</button>{% endif %}
    </div>
  </details>
  <p class="copy-status inline-status" role="status"></p>
  <div id="copy-fallback" hidden>
    <label for="copy-output">متن آمادهٔ کپی</label>
    <textarea id="copy-output" rows="5" readonly></textarea>
  </div>
</section>
